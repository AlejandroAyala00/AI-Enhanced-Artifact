<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – GreenLink</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800">
  <nav class="bg-green-600 text-white p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold">🌿 GreenLink</h1>
    <ul class="flex gap-4">
      <li><a href="index.html" class="hover:underline">Home</a></li>
      <li><a href="dashboard.html" class="hover:underline">Dashboard</a></li>
      <li><a href="about.html" class="hover:underline">About</a></li>
      <li><a href="contact.html" class="hover:underline">Contact</a></li>
    </ul>
  </nav>

  <section class="max-w-xl mx-auto p-8">
    <h2 class="text-3xl font-bold mb-4">Contact Us</h2>
    <form class="flex flex-col gap-4">
      <input type="text" placeholder="Your Name" class="border p-2 rounded" required>
      <input type="email" placeholder="Your Email" class="border p-2 rounded" required>
      <textarea placeholder="Your Message" class="border p-2 rounded" required></textarea>
      <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Send</button>
    </form>
  </section>
</body>
</html>
